[project]
name = "news-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "trafilatura>=2.3.1",
    "warcio>=1.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["warcio.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
    "types-tqdm>=4.70.0.20260906",
]
